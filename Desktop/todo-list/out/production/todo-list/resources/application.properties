spring.application.name=todo-list-app

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/todo_list_app}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Origin the frontend runs on - Vite's default dev port is 5173.
# Override with an env var once the frontend is deployed somewhere real.
app.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}
